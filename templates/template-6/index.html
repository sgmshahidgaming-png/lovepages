<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="page-title">For You 🐼❤️</title>
<meta name="description" content="A small sorry, made with care.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --blush:        #f5c6dc;
  --baby-pink:    #eeb4cf;
  --lavender:     #d3bdf0;
  --peach:        #f5c9a8;
  --cream:        #fffaf3;
  --rose-gold:    #d99b8f;
  --plum:         #2e1a2a;
  --plum-soft:    #5c3f56;
  --white:        #ffffff;

  /* premium accents */
  --gold:         #cda15a;
  --gold-soft:    #f3dfae;
  --gold-deep:    #9c6f34;
  --gold-grad:    linear-gradient(120deg, var(--gold-deep), var(--gold), var(--gold-soft), var(--gold));

  --glass-bg:      rgba(255,255,255,0.52);
  --glass-border:  rgba(255,255,255,0.7);
  --glass-shadow:  0 20px 60px -20px rgba(80,40,70,0.45);
  --gold-shadow:   0 2px 20px -4px rgba(205,161,90,0.6);

  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 14px;

  --font-display: 'Playfair Display', serif;
  --font-body: 'Poppins', sans-serif;

  --ease: cubic-bezier(.22,.9,.32,1);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--plum);
  background:
    radial-gradient(circle at 12% 8%, var(--lavender) 0%, transparent 42%),
    radial-gradient(circle at 88% 15%, var(--blush) 0%, transparent 48%),
    radial-gradient(circle at 50% 95%, var(--peach) 0%, transparent 52%),
    radial-gradient(circle at 50% 45%, rgba(243,223,174,0.4) 0%, transparent 60%),
    radial-gradient(ellipse at center, transparent 45%, rgba(46,26,42,0.16) 100%),
    var(--cream);
  background-size:200% 200%, 200% 200%, 200% 200%, 160% 160%, 100% 100%, auto;
  animation: bgDrift 26s ease-in-out infinite;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
@keyframes bgDrift{
  0%,100%{ background-position:0% 0%, 100% 0%, 50% 100%, 50% 50%, 0 0, 0 0; }
  50%{ background-position:10% 10%, 90% 15%, 55% 90%, 45% 55%, 0 0, 0 0; }
}
h1,h2,h3{ font-family:var(--font-display); margin:0; color:var(--plum); font-weight:600; }
.heading{
  background:linear-gradient(120deg, var(--plum) 30%, var(--gold-deep) 50%, var(--plum) 70%);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:var(--plum);
  animation: shineText 7s ease-in-out infinite;
}
@keyframes shineText{
  0%,100%{ background-position:0% center; }
  50%{ background-position:100% center; }
}
p{ margin:0; }
button{ font-family:var(--font-body); border:none; cursor:pointer; background:none; }
img{ max-width:100%; display:block; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
}

/* ============================================================
   TYPING ENGINE
   ============================================================ */
.word{
  display:inline-block;
  opacity:0;
  transform:translateY(6px);
  filter:blur(3px);
  transition:opacity .35s ease, transform .35s ease, filter .35s ease;
  white-space:pre-wrap;
}
.word.show{ opacity:1; transform:translateY(0); filter:blur(0); }
.type-line{ display:block; }
.type-cursor{
  display:inline-block;
  width:2px;
  margin-left:2px;
  animation:blink 0.9s step-start infinite;
  color:var(--rose-gold);
  font-weight:600;
}
@keyframes blink{ 50%{ opacity:0; } }

/* ============================================================
   LAYOUT / SECTIONS
   ============================================================ */
.section{
  min-height:100dvh;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:80px 20px;
  position:relative;
  text-align:center;
}
.section-inner{ max-width:640px; width:100%; display:flex; flex-direction:column; align-items:center; gap:22px; }
#envelope-section .section-inner{ max-width:780px; }
#cards-section .section-inner{ max-width:960px; }
.eyebrow{
  font-size:clamp(12px,2vw,14px);
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold-deep);
  font-weight:600;
}
.heading{ font-size:clamp(30px,6.6vw,48px); line-height:1.28; letter-spacing:.005em; }
.body-text{ font-size:clamp(18px,3.6vw,22px); line-height:2; color:var(--plum-soft); font-weight:400; letter-spacing:.01em; }

/* glass card */
.glass{
  position:relative;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:var(--radius-lg);
  box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.6);
  padding:clamp(24px,5vw,48px);
}
.glass::before{
  content:"";
  position:absolute; inset:0;
  border-radius:inherit;
  padding:1px;
  background:var(--gold-grad);
  background-size:220% auto;
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:.55;
  pointer-events:none;
  animation:shineText 7s ease-in-out infinite;
}

/* reveal on scroll */
.reveal{ opacity:0; transform:translateY(28px); transition:opacity .8s var(--ease), transform .8s var(--ease); }
.reveal.in{ opacity:1; transform:translateY(0); }

/* floating panda */
.float-anim{ animation:floaty 5s ease-in-out infinite; }
@keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-14px);} }

.char-img{
  width:clamp(140px,32vw,220px);
  height:clamp(140px,32vw,220px);
  object-fit:contain;
  filter:drop-shadow(0 18px 30px rgba(140,90,130,0.25)) drop-shadow(0 4px 14px rgba(205,161,90,0.25));
}
.char-img.small{ width:clamp(70px,18vw,110px); height:clamp(70px,18vw,110px); }
.char-fallback{
  width:clamp(140px,32vw,220px);
  height:clamp(140px,32vw,220px);
  border-radius:50%;
  background:linear-gradient(145deg,var(--baby-pink),var(--lavender));
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(48px,10vw,72px);
}

/* ============================================================
   BACKGROUND PARTICLES
   ============================================================ */
#particle-layer{
  position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
}
.particle{
  position:absolute; bottom:-40px;
  color:var(--rose-gold);
  opacity:.55;
  animation:rise linear infinite;
  will-change:transform;
}
@keyframes rise{
  0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
  10%{ opacity:.6; }
  90%{ opacity:.5; }
  100%{ transform:translateY(-110vh) translateX(var(--drift,20px)) rotate(360deg); opacity:0; }
}
.section, header, footer{ position:relative; z-index:1; }

/* ============================================================
   LOADING SCREEN
   ============================================================ */
#loader{
  position:fixed; inset:0; z-index:999;
  background:linear-gradient(160deg,var(--lavender),var(--blush) 55%, var(--peach));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px;
  transition:opacity .8s ease, visibility .8s ease;
}
#loader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
.loader-heart{
  font-size:44px;
  animation:pulseHeart 1.1s ease-in-out infinite;
}
@keyframes pulseHeart{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.25);} }
#loader-text{ font-family:var(--font-display); font-size:clamp(16px,4vw,20px); color:var(--plum); max-width:80vw; }
.loader-bar{ width:180px; height:4px; border-radius:4px; background:rgba(255,255,255,.6); overflow:hidden; }
.loader-bar-fill{ height:100%; width:0%; background:var(--rose-gold); border-radius:4px; animation:fillBar 1.8s var(--ease) forwards; }
@keyframes fillBar{ to{ width:100%; } }

/* ============================================================
   HERO / NAV / PROGRESS
   ============================================================ */
#progress-bar{
  position:fixed; top:0; left:0; height:4px; width:0%;
  background:linear-gradient(90deg,var(--rose-gold),var(--lavender));
  z-index:500; transition:width .1s linear;
}

.cta-btn{
  position:relative;
  overflow:hidden;
  padding:16px 38px;
  border-radius:100px;
  background:linear-gradient(135deg,var(--rose-gold),var(--baby-pink));
  border:1px solid rgba(255,255,255,.5);
  color:#fff;
  font-weight:600;
  font-size:16px;
  letter-spacing:.01em;
  box-shadow:0 14px 30px -10px rgba(232,169,161,0.7), var(--gold-shadow);
  min-height:52px;
  min-width:44px;
  opacity:0;
  transform:translateY(10px) scale(.96);
  transition:opacity .5s ease, transform .5s ease, box-shadow .3s ease;
}
.cta-btn::after{
  content:"";
  position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,.65), transparent);
  transform:skewX(-20deg);
  animation:sheen 3.2s ease-in-out infinite;
}
@keyframes sheen{ 0%{ left:-60%; } 55%,100%{ left:130%; } }
.cta-btn.show{ opacity:1; transform:translateY(0) scale(1); }
.cta-btn:hover{ box-shadow:0 18px 36px -8px rgba(232,169,161,0.85), var(--gold-shadow); transform:translateY(-3px) scale(1.02); }
.cta-btn:active{ transform:translateY(0) scale(.97); }
.cta-btn:focus-visible{ outline:3px solid var(--plum); outline-offset:3px; }

/* ============================================================
   ENVELOPE
   ============================================================ */
.envelope-wrap{ perspective:1200px; cursor:pointer; margin-top:2px; }
#env-sub{ margin-top:-6px; }
.envelope{
  width:min(300px,80vw);
  height:190px;
  position:relative;
  transition:transform .4s var(--ease);
}
.envelope-wrap:hover .envelope{ transform:translateY(-4px); }
.env-body{
  position:absolute; inset:0;
  background:linear-gradient(160deg,#fff,var(--blush));
  border-radius:14px;
  box-shadow:0 20px 40px -18px rgba(140,90,130,.5);
  border:1px solid rgba(255,255,255,.8);
}
.env-flap{
  position:absolute; top:0; left:0; width:100%; height:100%;
  clip-path:polygon(0 0, 50% 55%, 100% 0);
  background:linear-gradient(160deg,var(--rose-gold),var(--baby-pink));
  border-radius:14px 14px 0 0;
  transform-origin:top;
  transition:transform .9s var(--ease);
  z-index:3;
}
.envelope.open .env-flap{ transform:rotateX(180deg); }
.env-heart{
  position:absolute; top:44%; left:50%; transform:translate(-50%,-50%);
  font-size:26px; z-index:4;
  transition:opacity .3s ease;
}
.envelope.open .env-heart{ opacity:0; }
.env-letter{
  position:absolute; left:8%; right:8%; bottom:6px;
  height:70%;
  background:var(--cream);
  border-radius:10px 10px 4px 4px;
  box-shadow:0 -6px 18px rgba(0,0,0,.08);
  z-index:2;
  transform:translateY(6%);
  transition:transform 1s var(--ease) .3s;
}
.envelope.open .env-letter{ transform:translateY(-92%); }
.envelope.shake{ animation:shakeEnv .5s ease; }
@keyframes shakeEnv{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-2deg);} 75%{transform:rotate(2deg);} }

.letter-paper{
  position:relative;
  width:92vw; max-width:780px;
  background:linear-gradient(180deg, var(--cream), #fff);
  border-radius:var(--radius-md);
  border:1px solid rgba(205,161,90,0.35);
  box-shadow:0 24px 50px -20px rgba(140,90,130,.4), var(--gold-shadow);
  padding:clamp(26px,5vw,48px);
  margin-top:36px;
  opacity:0; transform:translateY(20px) scale(.98);
  transition:opacity .7s ease, transform .7s ease;
  text-align:left;
}
@media (min-width:600px){ .letter-paper{ width:700px; } }
.letter-paper::before{
  content:"";
  position:absolute; top:10px; left:10px; right:10px; bottom:10px;
  border:1px solid rgba(205,161,90,0.3);
  border-radius:calc(var(--radius-md) - 6px);
  pointer-events:none;
}
.letter-paper.show{ opacity:1; transform:translateY(0) scale(1); }
.letter-paper .body-text{ text-align:left; }
.letter-paper .body-text .type-line{ margin-bottom:14px; }

/* ============================================================
   CARDS GRID
   ============================================================ */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  width:100%;
  max-width:920px;
}
@media (max-width:900px){ .cards-grid{ grid-template-columns:repeat(2,1fr); max-width:680px; } }
@media (max-width:560px){ .cards-grid{ grid-template-columns:1fr; width:92%; max-width:460px; margin:0 auto; } }
.mini-card{
  position:relative;
  overflow:hidden;
  border-radius:var(--radius-md);
  padding:clamp(28px,4vw,36px) clamp(22px,3vw,28px);
  min-height:250px;
  text-align:center;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  opacity:0; transform:translateY(24px);
  transition:opacity .6s var(--ease), transform .6s var(--ease), box-shadow .35s ease, border-color .35s ease;
}
.mini-card::after{
  content:"";
  position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--gold-grad);
  background-size:220% auto;
  animation:shineText 6s ease-in-out infinite;
}
/* soft accent tint variation so cards feel individually flavoured but coordinated */
.mini-card:nth-child(5n+1){ background:linear-gradient(160deg, rgba(211,189,240,0.30), var(--glass-bg)); }
.mini-card:nth-child(5n+2){ background:linear-gradient(160deg, rgba(245,198,220,0.30), var(--glass-bg)); }
.mini-card:nth-child(5n+3){ background:linear-gradient(160deg, rgba(245,201,168,0.30), var(--glass-bg)); }
.mini-card:nth-child(5n+4){ background:linear-gradient(160deg, rgba(217,155,143,0.22), var(--glass-bg)); }
.mini-card:nth-child(5n+5){ background:linear-gradient(160deg, rgba(238,180,207,0.28), var(--glass-bg)); }
.mini-card.in{ opacity:1; transform:translateY(0); }
.mini-card:hover{
  transform:translateY(-6px) scale(1.015);
  box-shadow:0 26px 50px -18px rgba(140,90,130,0.45), 0 0 0 1px rgba(205,161,90,0.25);
}
.mini-card h3{ font-size:19px; letter-spacing:.01em; }
.mini-card p{ font-size:15.5px; color:var(--plum-soft); line-height:1.65; }
.mini-card .card-sub .type-line{ display:block; margin-bottom:4px; }
.card-title{
  background:linear-gradient(120deg, var(--plum), var(--gold-deep) 50%, var(--plum));
  background-size:220% auto;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--plum);
}

/* ============================================================
   CHAT
   ============================================================ */
.chat-wrap{
  width:100%; max-width:480px;
  display:flex; flex-direction:column; gap:12px;
  align-items:stretch;
}
.chat-row{ display:flex; align-items:flex-end; gap:10px; opacity:0; transform:translateY(10px); transition:opacity .5s ease, transform .5s ease; }
.chat-row.in{ opacity:1; transform:translateY(0); }
.chat-row.right{ flex-direction:row-reverse; }
.chat-avatar{ width:36px; height:36px; border-radius:50%; flex:none; overflow:hidden; background:var(--lavender); display:flex; align-items:center; justify-content:center; font-size:18px; }
.chat-bubble{
  background:var(--white);
  border-radius:18px;
  padding:12px 16px;
  font-size:15px;
  box-shadow:0 8px 18px -10px rgba(140,90,130,.3);
  max-width:75%;
  text-align:left;
}
.chat-row.right .chat-bubble{ background:linear-gradient(135deg,var(--baby-pink),var(--lavender)); }
.typing-dots{
  display:flex; gap:4px; padding:12px 16px; background:var(--white); border-radius:18px; width:fit-content;
  box-shadow:0 8px 18px -10px rgba(140,90,130,.3);
}
.typing-dots span{ width:6px; height:6px; border-radius:50%; background:var(--rose-gold); animation:dotPulse 1.2s ease-in-out infinite; }
.typing-dots span:nth-child(2){ animation-delay:.15s; }
.typing-dots span:nth-child(3){ animation-delay:.3s; }
@keyframes dotPulse{ 0%,60%,100%{ opacity:.3; transform:translateY(0);} 30%{ opacity:1; transform:translateY(-3px);} }
.big-shout{ font-family:var(--font-display); font-size:clamp(22px,6vw,32px); margin-top:6px; opacity:0; transform:scale(.9); transition:opacity .5s ease, transform .5s ease; }
.big-shout.in{ opacity:1; transform:scale(1); }

/* ============================================================
   FOUR IMPORTANT THINGS
   ============================================================ */
.important-list{ display:flex; flex-direction:column; gap:16px; width:100%; text-align:left; }
.important-item{ display:flex; align-items:center; gap:14px; font-size:clamp(16px,3vw,19px); color:var(--plum); }
.important-dot{ width:8px; height:8px; border-radius:50%; background:var(--rose-gold); flex:none; }

/* ============================================================
   FORGIVENESS BUTTONS
   ============================================================ */
.choice-row{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; position:relative; min-height:60px; width:100%; }
.btn-yes{
  position:relative; overflow:hidden;
  padding:16px 34px; border-radius:100px; font-weight:600; font-size:16px; color:#fff;
  background:linear-gradient(135deg,var(--rose-gold),var(--baby-pink));
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 14px 30px -10px rgba(232,169,161,.7), var(--gold-shadow);
  min-height:52px; transition:transform .25s ease, box-shadow .25s ease;
}
.btn-yes::after{
  content:"";
  position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,.65), transparent);
  transform:skewX(-20deg);
  animation:sheen 3.2s ease-in-out infinite;
}
.btn-yes:hover{ transform:translateY(-3px); }
.btn-yes:active{ transform:scale(.96); }
.btn-no{
  padding:16px 34px; border-radius:100px; font-weight:600; font-size:16px;
  color:var(--plum); background:var(--white); border:1px solid rgba(140,90,130,.2);
  min-height:52px; position:relative; transition:transform .35s var(--ease);
}
.btn-yes:focus-visible, .btn-no:focus-visible{ outline:3px solid var(--plum); outline-offset:3px; }
.no-msg{ font-size:13px; color:var(--rose-gold); margin-top:8px; min-height:16px; }

/* ============================================================
   CONFETTI / HEART BURST
   ============================================================ */
.burst-heart{
  position:fixed; z-index:600; pointer-events:none; font-size:20px;
  animation:burstUp 1.1s ease-out forwards;
}
@keyframes burstUp{
  0%{ opacity:1; transform:translate(0,0) scale(1) rotate(0);}
  100%{ opacity:0; transform:translate(var(--dx,0px),var(--dy,-120px)) scale(1.4) rotate(var(--rot,120deg));}
}
.confetti-piece{
  position:fixed; z-index:601; pointer-events:none; font-size:18px;
  animation:confettiFall 2.2s ease-in forwards;
}
@keyframes confettiFall{
  0%{ opacity:1; transform:translate(0,0) rotate(0);}
  100%{ opacity:0; transform:translate(var(--dx,0px), 100vh) rotate(var(--rot,540deg));}
}

/* checkmark */
.check-wrap{ width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--rose-gold),var(--baby-pink)); display:flex; align-items:center; justify-content:center; margin:0 auto; }
.check-wrap svg{ width:32px; height:32px; }
.check-wrap path{ stroke:#fff; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:40; stroke-dashoffset:40; animation:drawCheck .6s ease forwards .2s; }
@keyframes drawCheck{ to{ stroke-dashoffset:0; } }

/* ============================================================
   MUSIC BUTTON
   ============================================================ */
#music-btn{
  position:fixed; bottom:22px; right:22px; z-index:400;
  width:52px; height:52px; border-radius:50%;
  background:var(--glass-bg); backdrop-filter:blur(14px);
  border:1px solid rgba(205,161,90,0.55);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; box-shadow:var(--glass-shadow), var(--gold-shadow);
  transition:transform .3s ease;
}
#music-btn:hover{ transform:scale(1.08); }
#music-btn.playing{ animation:spinSlow 6s linear infinite; }
@keyframes spinSlow{ to{ transform:rotate(360deg); } }

/* ============================================================
   BACK TO TOP
   ============================================================ */
#back-to-top{
  position:fixed; bottom:22px; left:22px; z-index:400;
  width:48px; height:48px; border-radius:50%;
  background:var(--glass-bg); backdrop-filter:blur(14px);
  border:1px solid var(--glass-border);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; box-shadow:var(--glass-shadow);
  opacity:0; visibility:hidden; transform:translateY(10px);
  transition:opacity .35s ease, transform .35s ease, visibility .35s ease;
}
#back-to-top.show{ opacity:1; visibility:visible; transform:translateY(0); }

/* footer */
footer{ padding:40px 20px 100px; text-align:center; color:var(--plum-soft); font-size:13px; }

.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

@media (max-width:400px){

/* ============================================================
   REUSABLE WORD-BY-WORD TYPING ENGINE
   ============================================================ */
function splitTokens(text){
  // splits into words while keeping trailing punctuation attached
  return text.split(/\s+/).filter(Boolean);
}

function pauseFor(word){
  if(/\.\.\.$/.test(word)) return 520;
  if(/[.!?]$/.test(word)) return 380;
  if(/,$/.test(word)) return 200;
  return 0;
}

/**
 * typeWords(element, text, options)
 * Renders `text` into `element` one word at a time.
 * text may contain \n\n for paragraph breaks (rendered as separate <span class="type-line">).
 * Returns a Promise that resolves when typing completes.
 */
function typeWords(element, text, options={}){
  const speed = options.speed || 110;
  const paragraphPause = options.paragraphPause ?? 600;
  const runOnceKey = options.runOnceKey;

  if(runOnceKey){
    if(element.dataset.typed === runOnceKey){
      return Promise.resolve(); // already typed, do nothing
    }
  }

  // cancellation protection: give this run a token id
  const token = Symbol();
  element._typeToken = token;
  element.innerHTML = "";

  const cursor = document.createElement("span");
  cursor.className = "type-cursor";
  cursor.textContent = "|";
  cursor.setAttribute("aria-hidden","true");

  const paragraphs = text.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);

  return new Promise(resolve=>{
    let pIndex = 0;

    function typeParagraph(){
      if(element._typeToken !== token) return; // cancelled
      if(pIndex >= paragraphs.length){
        cursor.remove();
        if(runOnceKey) element.dataset.typed = runOnceKey;
        resolve();
        return;
      }
      const line = document.createElement("span");
      line.className = "type-line";
      element.appendChild(line);
      line.appendChild(cursor);

      const words = splitTokens(paragraphs[pIndex]);
      let wIndex = 0;

      function typeWord(){
        if(element._typeToken !== token) return; // cancelled mid-run
        if(wIndex >= words.length){
          pIndex++;
          setTimeout(typeParagraph, paragraphPause);
          return;
        }
        const w = document.createElement("span");
        w.className = "word";
        w.textContent = words[wIndex] + (wIndex < words.length-1 ? " " : "");
        line.insertBefore(w, cursor);
        // force reflow then show, for a clean transition
        requestAnimationFrame(()=> requestAnimationFrame(()=> w.classList.add("show")));

        const extra = pauseFor(words[wIndex]);
        wIndex++;
        setTimeout(typeWord, speed + extra);
      }
      typeWord();
    }
    typeParagraph();
  });
}

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ============================================================
   INTERSECTION OBSERVER — trigger-once section typing
   ============================================================ */
const triggeredSections = new Set();
function onceVisible(el, callback, threshold=0.35){
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && !triggeredSections.has(el)){
        triggeredSections.add(el);
        callback();
        obs.unobserve(el);
      }
    });
  }, {threshold});
  obs.observe(el);
}

/* generic scroll reveal (non-typing elements) */
const revealObserver = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add("in");
      revealObserver.unobserve(entry.target);
    }
  });
}, {threshold:0.2});
document.querySelectorAll(".reveal").forEach(el=>revealObserver.observe(el));

  const count = isSmall ? 12 : 22;
  const glyphs = ["♥","✦","·","♡","✧"];
  for(let i=0;i<count;i++){
    const p = document.createElement("span");
    p.className = "particle";
    p.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    const size = 10 + Math.random()*16;
    const isGold = Math.random() > 0.55;
    p.style.left = Math.random()*100 + "vw";
    p.style.fontSize = size + "px";
    if(isGold) p.style.color = "var(--gold)";
    p.style.setProperty("--drift", (Math.random()*80-40)+"px");
    p.style.animationDuration = (10 + Math.random()*10) + "s";
    p.style.animationDelay = (Math.random()*10) + "s";
    p.style.filter = `blur(${Math.random()>0.7?1:0}px)`;
    layer.appendChild(p);
  }
}

/* --- funny NO button that dodges up to 3 times --- */
const btnNo = document.getElementById("btn-no");
const choiceRow = document.getElementById("choice-row");
const noMsg = document.getElementById("no-msg");
let noAttempts = 0;
const noLines = ["Arey ruko 😭", "Itna bhi gussa? 🐼🥺", "Chalo ek try toh sahi 😂❤️"];

function dodge(){
  const rowRect = choiceRow.getBoundingClientRect();
  const btnRect = btnNo.getBoundingClientRect();
  const maxX = Math.max(0, rowRect.width - btnRect.width - 8);
  const dx = (Math.random()*maxX) - (btnNo.offsetLeft||0)*0.2;
  const clampedDx = Math.max(-rowRect.width*0.3, Math.min(rowRect.width*0.3, dx));
  const dy = (Math.random()*20 - 10);
  btnNo.style.transform = `translate(${clampedDx}px, ${dy}px)`;
}

async function handleNoAttempt(e){
  if(noAttempts < 3){
    e.preventDefault();
    dodge();
    await typeWords(noMsg, noLines[noAttempts], {speed:90});
    noAttempts++;
    if(noAttempts >= 3){
      // settle back into place and become normally clickable
      setTimeout(()=>{ btnNo.style.transform = ""; }, 400);
    }
    return;
  }
  showNoResponse();
}
btnNo.addEventListener("click", handleNoAttempt);
btnNo.addEventListener("touchstart", (e)=>{ /* allow tap without double firing */ }, {passive:true});

function heartBurstAt(x,y,count=8){
  const hearts = ["❤️","💗","💕","✨"];
  for(let i=0;i<count;i++){
    const h = document.createElement("span");
    h.className = "burst-heart";
    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = x+"px";
    h.style.top = y+"px";
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*90;
    h.style.setProperty("--dx", Math.cos(angle)*dist+"px");
    h.style.setProperty("--dy", (Math.sin(angle)*dist - 60)+"px");
    h.style.setProperty("--rot", (Math.random()*240-120)+"deg");
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 1200);
  }
}

function confettiBurst(count=36){
  const glyphs = ["❤️","💗","💕","🌸","✨"];
  const w = window.innerWidth;
  for(let i=0;i<count;i++){
    const c = document.createElement("span");
    c.className = "confetti-piece";
    c.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    c.style.left = Math.random()*w + "px";
    c.style.top = "-30px";
    c.style.setProperty("--dx", (Math.random()*160-80)+"px");
    c.style.setProperty("--rot", (Math.random()*720-360)+"deg");
    c.style.animationDelay = (Math.random()*0.4)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2800);
  }
}

   ============================================================ */
const musicBtn = document.getElementById("music-btn");
const audio = document.getElementById("bg-audio");
let musicReady = false;
let isPlaying = false;

function ensureAudioSrc(){
  if(!musicReady && CONFIG.backgroundMusic && !CONFIG.backgroundMusic.startsWith("PASTE_")){
    audio.src = CONFIG.backgroundMusic;
    musicReady = true;
  }
}

musicBtn.addEventListener("click", ()=>{
  ensureAudioSrc();
  if(!musicReady){
    musicBtn.textContent = "🎵";
    musicBtn.setAttribute("aria-label","Add a music URL in CONFIG to enable playback");
    return;
  }
  if(isPlaying){
    audio.pause();
    isPlaying = false;
    musicBtn.textContent = "▶";
    musicBtn.classList.remove("playing");
    musicBtn.setAttribute("aria-pressed","false");
  } else {
    audio.play().catch(()=>{});
    isPlaying = true;
    musicBtn.textContent = "⏸";
    musicBtn.classList.add("playing");
    musicBtn.setAttribute("aria-pressed","true");
  }
});
